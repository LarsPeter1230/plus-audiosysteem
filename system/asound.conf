# ===== Hardware =====
pcm.hwcodec {
  type hw
  card 0
  device 0
}
ctl.hwcodec {
  type hw
  card 0
}

# ===== dmix voor gedeelde playback =====
pcm.dmixed {
  type dmix
  ipc_key 5678293
  ipc_perm 0666
  slave {
    pcm "hwcodec"
    rate 48000
    channels 2
    period_time 0
    period_size 1024
    buffer_size 8192
  }
}

# ===== dsnoop voor gedeelde capture (linein) =====
pcm.linein_shared {
  type dsnoop
  ipc_key 5678294
  ipc_perm 0666
  slave {
    pcm "hwcodec"
    rate 48000
    channels 2
    period_size 1024
    buffer_size 8192
  }
}

# ===== linein via dsnoop (gedeeld door omroep + stream) =====
pcm.linein {
  type plug
  slave.pcm "linein_shared"
}

# ===== DAC output =====
pcm.dac {
  type plug
  slave.pcm "dmixed"
}
ctl.dac {
  type hw
  card 0
}

# ===== Default =====
pcm.!default {
  type plug
  slave.pcm "dac"
}
ctl.!default {
  type hw
  card 0
}

# ===== Achtergrond volume (BG) =====
pcm.bg {
  type softvol
  slave.pcm "dac"
  control {
    name "BG"
    card 0
  }
  min_dB -51.0
  max_dB 0.0
}
ctl.bg {
  type hw
  card 0
}

# ===== Preset volume (PST) =====  (GEEN EQ — presets/TTS ongewijzigd)
pcm.pst {
  type softvol
  slave.pcm "dac"
  control {
    name "PST"
    card 0
  }
  min_dB -51.0
  max_dB 0.0
}
ctl.pst {
  type hw
  card 0
}

# ===== EQ voor Spotify (alsaequal, 10-band, alleen het spot-pad) =====
# go-librespot -> spot (softvol) -> eq_spot_plug (plug) -> eq_spot (equal) -> dac
pcm.eq_spot {
  type equal
  controls "/home/radio/.eq_spot.bin"
  slave.pcm "dac"
}
ctl.eq_spot {
  type equal
  controls "/home/radio/.eq_spot.bin"
}
pcm.eq_spot_plug {
  type plug
  slave.pcm "eq_spot"
}

# ===== Spotify volume (SPOT) =====  (nu via de EQ)
pcm.spot {
  type softvol
  slave.pcm "eq_spot_plug"
  control {
    name "SPOT"
    card 0
  }
  min_dB -51.0
  max_dB 0.0
}
ctl.spot {
  type hw
  card 0
}

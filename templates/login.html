{% extends "base.html" %}
{% block content %}
<h1>Admin pincode</h1>
{% if error %}<div style="color:#b00020;margin-bottom:10px">{{ error }}</div>{% endif %}
<form method="post" style="max-width:320px">
  <div class="label">Pincode</div>
  <input class="input" name="pin" type="password" inputmode="numeric" pattern="\\d*" maxlength="6" placeholder="6-cijferige pincode" autofocus required>
  <div style="height:12px"></div>
  <button class="btn" type="submit">Login</button>
</form>
{% endblock %}

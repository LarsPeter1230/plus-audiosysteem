{% extends "base.html" %}
{% block content %}
<h1>Volume Control</h1>
<div class="row">
  <div class="col">
    <div class="label">PCM Volume</div>
    <input id="volSlider" class="range" type="range" min="0" max="100">
    <div style="height:8px"></div>
    <span class="badge" id="volBadge">--%</span>
    <span class="badge" id="muteBadge">--</span>
    <span class="badge" id="rcaBadge">RCA: …</span>
  </div>
  <div class="col">
    <div class="label">Bediening</div>
    <div style="display:flex; gap:10px">
      <button class="btn" onclick="step(-1)">−1</button>
      <button class="btn" onclick="step(1)">+1</button>
    </div>
    <div style="height:10px"></div>
    <button class="btn" onclick="muteToggle()">Mute toggle</button>
    <div style="height:10px"></div>
    <button class="btn" onclick="rcaToggle()">RCA toggle</button>
  </div>
</div>
<script>
bindVolumeSSE(
  "{{ url_for('events') }}",
  "{{ url_for('api_set_volume') }}",
  "{{ url_for('api_step') }}",
  "{{ url_for('api_mute_toggle') }}",
  "{{ url_for('api_rca_toggle') }}"
);
</script>
{% endblock %}
